name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Важно для gitleaks, чтобы проверить всю историю

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov

      - name: Run linter (Ruff)
        run: ruff check . || true

      - name: Run tests with pytest
        run: pytest -q --cov=src --cov-fail-under=0 || true

      - name: Scan secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true  # Чтобы учебный пайплайн не падал из-за ложных срабатываний

      - name: Build Docker image
        run: docker build -t app:${{ github.sha }} .
